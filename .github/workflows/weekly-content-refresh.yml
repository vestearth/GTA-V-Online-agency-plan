name: Weekly Content Refresh

on:
  workflow_dispatch:
    inputs:
      newswire_url:
        description: "Optional current weekly Newswire URL; otherwise use the reviewed source registry."
        required: false
        type: string
      publish_reviewed:
        description: "Publish the current approved payload and three reviewed reports without fetching"
        required: false
        default: false
        type: boolean
  # Scheduled intake disabled: a reviewed weekly source is required. Run manually.

permissions:
  contents: write

concurrency:
  group: gta-data-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-weekly-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run weekly content refresh
        env:
          WEEKLY_UPDATE_URL: ${{ github.event.inputs.newswire_url || vars.WEEKLY_UPDATE_URL }}
          PUBLISH_REVIEWED: ${{ inputs.publish_reviewed }}
        run: |
          if [ "$PUBLISH_REVIEWED" = "true" ]; then
            python3 scripts/run_weekly_content_refresh.py --publish-reviewed
          else
            python3 scripts/run_weekly_content_refresh.py
          fi

      - name: Commit and push weekly artifacts
        if: always()
        run: |
          git add -A data dashboard.html pixel-dashboard.html
          for path in reports/weekly_master_plan_*.md reports/event_master_plan_*.md; do
            [ ! -f "$path" ] || git add -f "$path"
          done
          if git diff --cached --quiet; then
            echo "No weekly content changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh weekly GTA Online content"
          # Reject a concurrent remote change; rerun from a fresh checkout. Never replay stale outputs.
          git push origin "HEAD:${GITHUB_REF_NAME}"
