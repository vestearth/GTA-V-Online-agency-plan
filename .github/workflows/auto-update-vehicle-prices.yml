name: Auto Update Vehicle Prices

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta-data-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-vehicle-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run vehicle price sync
        run: python3 scripts/update_vehicle_prices.py

      - name: Fill missing prices from GTACars
        run: python3 scripts/fetch_gtacar_prices.py --summary data/price_refresh_status.json

      - name: Commit and push changes
        run: |
          git add data/references/vehicle_prices.yaml data/references/vehicle_gtacars_slugs.json data/price_refresh_status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add data/references/vehicle_prices.yaml data/references/vehicle_gtacars_slugs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): auto-refresh vehicle price references"
          git push origin "HEAD:${GITHUB_REF_NAME}"
