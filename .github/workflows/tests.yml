name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        # Stdlib-only suite — no external dependencies to install.
        # Report artifacts under reports/ are gitignored, so the tests that
        # consume them skip cleanly here; everything else must pass.
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
